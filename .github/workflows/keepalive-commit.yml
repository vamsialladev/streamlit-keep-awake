name: Monthly keepalive commit

# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity. A tiny monthly commit keeps this repo "active".
on:
  schedule:
    - cron: "43 3 1 * *"   # 03:43 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update last-checked timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last-checked.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-checked.txt
          git commit -m "chore: keepalive $(cat last-checked.txt)"
          git push
