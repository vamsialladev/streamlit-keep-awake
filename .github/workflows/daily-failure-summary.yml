name: Daily failure summary

# Reads yesterday's rows in the shared ops log (one Neon database for every hotel app) and opens an issue, or posts to
# Slack if SLACK_WEBHOOK_URL is set, when an app's error rate was over 5% or it had requests but none succeeded.
# Read-only: a read-only transaction, and ideally a read-only database role (hotel-ai-platform docs/NEON_READONLY_ROLE.sql).
# Without the OPS_DATABASE_URL secret it's a dry run that changes nothing.

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC every day
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the shared ops package (pinned release)
        run: pip install "hotel-ai-platform[postgres] @ https://github.com/vamsialladev/hotel-ai-platform/archive/refs/tags/v0.1.3.zip"

      - name: Check yesterday's error rates
        env:
          OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m hotelplatform.daily_summary
          --apps hotel-ops-assistant,guest-request-agent,resort-activities-concierge,hotel-tools-mcp,hotel-ops-analytics-agent,fde-account-research-agent
          --alert-file alert.md

      - name: Open an issue when something needs a person
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Daily failure summary: action needed" --body-file alert.md
